    <ellipse class="foglia" style="animation-delay:1.9s" cx="804" cy="209" rx="13" ry="5.5" transform="rotate(35 804 209)" fill="#7E9A6B"/>
    <path class="stelo" style="animation-delay:0.5s" d="M860 268 C 854 216.0, 866 177.0, 860 138" stroke="#2E5B43"/>
    <ellipse class="foglia" style="animation-delay:1.4s" cx="846" cy="210" rx="13" ry="5.5" transform="rotate(-35 846 210)" fill="#7E9A6B"/>
    <ellipse class="foglia" style="animation-delay:1.6s" cx="874" cy="187" rx="13" ry="5.5" transform="rotate(35 874 187)" fill="#7E9A6B"/>
    <ellipse class="foglia" style="animation-delay:1.8s" cx="848" cy="164" rx="13" ry="5.5" transform="rotate(-30 848 164)" fill="#7E9A6B"/>
    <path class="stelo" style="animation-delay:1.2s" d="M940 268 C 934 240.0, 946 219.0, 940 198" stroke="#2E5B43"/>
    <g class="fiore" style="animation-delay:2.2s"><circle cx="940" cy="191" r="6" fill="#C9A646"/><circle cx="947" cy="198" r="6" fill="#C9A646"/><circle cx="940" cy="205" r="6" fill="#C9A646"/><circle cx="933" cy="198" r="6" fill="#C9A646"/><circle cx="940" cy="198" r="4" fill="#A3461F"/></g>
    <path class="stelo" style="animation-delay:0.9s" d="M1010 268 C 1004 202.0, 1016 152.5, 1010 103" stroke="#2E5B43"/>
    <circle class="chioma" style="animation-delay:2.0s" cx="1010" cy="85" r="36" fill="#7E9A6B" opacity=".85"/>
    <circle class="chioma" style="animation-delay:2.2s" cx="996" cy="99" r="25" fill="#2E5B43" opacity=".7"/>
    <path class="stelo" style="animation-delay:1.5s" d="M1090 268 C 1084 234.0, 1096 208.5, 1090 183" stroke="#2E5B43"/>
    <ellipse class="foglia" style="animation-delay:2.4s" cx="1076" cy="230" rx="13" ry="5.5" transform="rotate(-35 1076 230)" fill="#7E9A6B"/>
    <ellipse class="foglia" style="animation-delay:2.6s" cx="1104" cy="215" rx="13" ry="5.5" transform="rotate(35 1104 215)" fill="#7E9A6B"/>
    <ellipse class="foglia" style="animation-delay:2.8s" cx="1078" cy="200" rx="13" ry="5.5" transform="rotate(-30 1078 200)" fill="#7E9A6B"/>
    <path class="stelo" style="animation-delay:1.9s" d="M1150 268 C 1144 244.0, 1156 226.0, 1150 208" stroke="#2E5B43"/>
    <g class="fiore" style="animation-delay:2.9s"><circle cx="1150" cy="201" r="6" fill="#C9A646"/><circle cx="1157" cy="208" r="6" fill="#C9A646"/><circle cx="1150" cy="215" r="6" fill="#C9A646"/><circle cx="1143" cy="208" r="6" fill="#C9A646"/><circle cx="1150" cy="208" r="4" fill="#A3461F"/></g>
  </g>
</svg>
